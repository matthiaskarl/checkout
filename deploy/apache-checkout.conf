# Apache reverse proxy for the checkout API.
# Paste inside the HTTPS vhost (<VirtualHost *:443>, e.g. /etc/apache2/sites-available/default-ssl.conf).
# Requires: sudo a2enmod proxy proxy_http headers
#
# https://HOST/api/<path>  ->  http://127.0.0.1:8100/<path>

	# --- checkout API ---
	RedirectMatch 301 ^/api$ /api/
	ProxyPreserveHost On
	ProxyPass        /api/ http://127.0.0.1:8100/
	ProxyPassReverse /api/ http://127.0.0.1:8100/
	RequestHeader set X-Forwarded-Proto "https"
	# --- end checkout API ---
