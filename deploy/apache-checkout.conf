# Apache reverse proxy -> uvicorn on 127.0.0.1:8000
# Install: sudo a2enmod proxy proxy_http headers
#          sudo cp deploy/apache-checkout.conf /etc/apache2/sites-available/checkout.conf
#          sudo a2ensite checkout && sudo systemctl reload apache2
<VirtualHost *:80>
    ServerName localhost

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/
    RequestHeader set X-Forwarded-Proto "http"

    ErrorLog  ${APACHE_LOG_DIR}/checkout-error.log
    CustomLog ${APACHE_LOG_DIR}/checkout-access.log combined
</VirtualHost>
