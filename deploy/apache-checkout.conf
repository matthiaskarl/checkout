# Apache config for checkout, pasted inside the HTTPS vhost
# (<VirtualHost *:443>, i.e. /etc/apache2/sites-available/default-ssl.conf).
# Requires: sudo a2enmod proxy proxy_http headers
#
# https://HOST/api/...  ->  uvicorn http://127.0.0.1:8100/api/...   (FastAPI JSON API)
# https://HOST/ui/...   ->  uvicorn http://127.0.0.1:8100/ui/...    (FastAPI Jinja2 pages)
# https://HOST/app/...  ->  /srv/checkout/frontend                  (React build, static files)
# Paths are passed through unchanged: the app itself defines the /api and /ui prefixes.

	# --- checkout API ---
	RedirectMatch 301 ^/api$ /api/
	ProxyPreserveHost On
	ProxyPass        /api/ http://127.0.0.1:8100/api/
	ProxyPassReverse /api/ http://127.0.0.1:8100/api/
	RedirectMatch 301 ^/ui$ /ui/
	ProxyPass        /ui/  http://127.0.0.1:8100/ui/
	ProxyPassReverse /ui/  http://127.0.0.1:8100/ui/
	RequestHeader set X-Forwarded-Proto "https"
	# --- end checkout API ---

	# --- checkout React frontend ---
	RedirectMatch 301 ^/app$ /app/
	Alias /app/ /srv/checkout/frontend/
	<Directory /srv/checkout/frontend>
		Require all granted
		Options -Indexes
		# Single-page app: unknown paths under /app/ get index.html (client-side routing)
		FallbackResource /app/index.html
		# index.html must always be revalidated so new deploys are picked up immediately...
		<Files "index.html">
			Header set Cache-Control "no-cache"
		</Files>
	</Directory>
	# ...while hashed build assets (index-<hash>.js) never change and can be cached forever.
	<Directory /srv/checkout/frontend/assets>
		Header set Cache-Control "public, max-age=31536000, immutable"
		# Missing assets must be a real 404, not index.html
		FallbackResource disabled
	</Directory>
	# --- end checkout React frontend ---
