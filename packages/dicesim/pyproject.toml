[project]
name = "dicesim"
version = "0.1.0"
description = "Probability of reaching a symbol goal with keep-and-reroll dice (Monte Carlo or exact)"
requires-python = ">=3.11"
dependencies = []  # standard library only: usable anywhere

[project.scripts]
dicesim = "dicesim.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
