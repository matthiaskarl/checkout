[project]
name = "checkout"
version = "0.1.0"
description = "A small FastAPI + MySQL playground app"
authors = [
    { name = "Matthias Karl", email = "matthias.karl.sfdc@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "cryptography>=50.0.2",
    "dicesim",
    "fastapi[standard]>=0.162.0",
    "jinja2>=3.1.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pymysql>=1.2.3",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.0",
]

[project.scripts]
checkout-admin = "checkout.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
dicesim = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "packages/dicesim/tests", "packages/dicesim/src"]
addopts = "--doctest-modules"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "packages/dicesim/src", "packages/dicesim/tests"]
